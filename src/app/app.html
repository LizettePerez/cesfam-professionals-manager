
<main class="main-container">
  @if (!loading) {

  <div class="search-toolbar">
    <div class="search-toolbar__input">
      <app-search-bar
        (search)="onSearch($event)">
      </app-search-bar>
    </div>

    <button
      mat-flat-button
      class="app-add-button"
      (click)="addProfessional()">
      <mat-icon>add</mat-icon>
      Agregar
    </button>
  </div>

  <div class="sectors-container">
    @for (sector of filteredSectors; track sector.id) {
    <app-sector-card
      [sectorName]="sector.name"
      [sectorType]="sector.type"
      [sectorId]="sector.id"
      [professionals]="sector.professionals"
      [searchTerm]="searchTerm"
      (refreshSector)="reloadSector($event)">
    </app-sector-card>
    }
  </div>
  } @else {
  <div class="loading-page">
    <img src="/gif/loading.gif" alt="Cargando profesionales" />
  </div>
  }
</main>
