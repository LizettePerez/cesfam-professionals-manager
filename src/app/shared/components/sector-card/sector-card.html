@if (hasResults) {
<div class="sector-card" [ngClass]="sectorType" *ngIf="hasResults">

  <div class="sector-card__header">
    <div class="sector-card__header-left">
      <h2>{{ sectorName }}</h2>
      <span class="sector-card__count">
        {{ professionals.length }}
      </span>
    </div>
    <div class="sector-card__header-right">
      <button matMiniFab [ngClass]="sectorType" class="app-mini-fab-custom" (click)="confirmDialog('add')">
        <mat-icon>add</mat-icon>
      </button>
    </div>

  </div>

  <div class="sector-card__body">
    <table class="sector-table">
      <thead>
        <tr>
          <th class="capitalize">Profesional</th>
          <th class="capitalize">Especialidad</th>
          <th>Box</th>
          <!-- <th class="text-center">Duración</th>
          <th class="text-center">Espera máx.</th> -->
          <th></th>
          <th></th>
        </tr>
      </thead>

      <tbody>
        @for (p of visibleProfessionals; track p.id) {
        <tr>
          <td class="capitalize">{{ p.nombre }}</td>
          <td class="capitalize">{{ p.especialidad }}</td>
          <td>{{ p.box }}</td>
          <td>
            <button matMiniFab class="app-mini-fab app-mini-fab-edit"
              (click)="confirmDialog('edit', p)">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
          <td>
            <button matMiniFab class="app-mini-fab app-mini-fab-delete"
              (click)="confirmDialog('delete', p)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </tr>
        }
      </tbody>

    </table>

    <div class="sector-card__footer" *ngIf="remainingCount > 0">
      <button mat-button (click)="loadMore()" [ngClass]="sectorType">
        Ver todos ({{ remainingCount }})
      </button>
    </div>
  </div>
</div>
}@else {

}
